name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        env:
          PYTHONPATH: .
          APP_ENV: development
        run: pytest tests/unit -q --maxfail=5

  deploy-production:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Easypanel deploy webhook
        env:
          EASYPANEL_DEPLOY_WEBHOOK_URL: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_URL }}
        run: |
          if [[ -z "${EASYPANEL_DEPLOY_WEBHOOK_URL}" ]]; then
            echo "EASYPANEL_DEPLOY_WEBHOOK_URL não configurado — deploy manual necessário."
            echo "Use: ./scripts/trigger-easypanel-deploy.sh na VPS ou botão Deploy no painel."
            exit 0
          fi
          curl -fsS -X POST "${EASYPANEL_DEPLOY_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"${GITHUB_SHA}\",\"repository\":\"${GITHUB_REPOSITORY}\"}"
          echo "Webhook Easypanel acionado."
