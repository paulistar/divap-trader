# Produção: use com docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  app:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    environment:
      APP_ENV: production

  beat:
    environment:
      APP_ENV: production

  postgres:
    ports: []  # não expor publicamente

  redis:
    ports: []  # não expor publicamente
