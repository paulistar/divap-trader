services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://divap:divap@postgres:5432/divap
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs

  worker:
    build: .
    restart: unless-stopped
    command: celery -A src.core.celery_app worker -l info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://divap:divap@postgres:5432/divap
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  beat:
    build: .
    restart: unless-stopped
    command: celery -A src.core.celery_app beat -l info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://divap:divap@postgres:5432/divap
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: timescale/timescaledb:latest-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: divap
      POSTGRES_PASSWORD: divap
      POSTGRES_DB: divap
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divap -d divap"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
