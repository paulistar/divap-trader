# Easypanel — projeto martstudios, serviço compose "divap-trader"
# Domínio: trade.martstudiosbr.com.br → app:80 (padrão Mart Studios: Traefik :80 → container :80)
#
# Variáveis com ${NOME} são repassadas quando definidas no textarea Environment do Easypanel.
# O painel NÃO preenche esse textarea automaticamente — veja deploy/easypanel-iqoption.env.snippet
x-shared-env: &shared-env
  APP_ENV: production
  APP_DEBUG: "false"
  API_KEY: ${API_KEY:-change-me}
  DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  BINANCE_API_KEY: ${BINANCE_API_KEY:-}
  BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
  BINANCE_USE_TESTNET: ${BINANCE_USE_TESTNET:-true}
  TRADING_ENABLED: ${TRADING_ENABLED:-false}
  TRADING_MODE: ${TRADING_MODE:-testnet}
  TRADING_MIN_CONFIDENCE: ${TRADING_MIN_CONFIDENCE:-high}
  TRADING_BLOCK_ON_CONTEXT_REJECT: ${TRADING_BLOCK_ON_CONTEXT_REJECT:-true}
  TRADING_MAX_OPEN_TRADES: ${TRADING_MAX_OPEN_TRADES:-5}
  TRADING_DRY_RUN: ${TRADING_DRY_RUN:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  OPENAI_MODEL_TRIAGE: ${OPENAI_MODEL_TRIAGE:-gpt-4o-mini}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  CONTEXT_ENABLED: ${CONTEXT_ENABLED:-true}
  CONTEXT_NEWS_LIMIT: ${CONTEXT_NEWS_LIMIT:-5}
  CRYPTOPANIC_API_KEY: ${CRYPTOPANIC_API_KEY:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_CLAIMS_SUB: ${VAPID_CLAIMS_SUB:-mailto:trade@martstudiosbr.com.br}
  FXCM_ACCESS_TOKEN: ${FXCM_ACCESS_TOKEN:-}
  FXCM_SERVER: ${FXCM_SERVER:-demo}
  FXCM_ACCOUNT_ID: ${FXCM_ACCOUNT_ID:-}
  # OTC — IQ Option (perfil otc; use PRACTICE = conta demo)
  IQOPTION_EMAIL: ${IQOPTION_EMAIL:-}
  IQOPTION_PASSWORD: ${IQOPTION_PASSWORD:-}
  IQOPTION_ACCOUNT_MODE: ${IQOPTION_ACCOUNT_MODE:-PRACTICE}
  IQOPTION_MCP_TOKEN: ${IQOPTION_MCP_TOKEN:-}
  IQOPTION_MCP_URL: ${IQOPTION_MCP_URL:-https://digital-options.mcp.iqoption.com}
  OTC_TRADING_ENABLED: ${OTC_TRADING_ENABLED:-false}
  OTC_TELEGRAM_CHAT_ID: ${OTC_TELEGRAM_CHAT_ID:-}

services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "80"
    environment:
      <<: *shared-env
      PORT: "80"
      DATABASE_URL: postgresql://divap:${POSTGRES_PASSWORD:-divap}@postgres:5432/divap
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    restart: unless-stopped
    command: celery -A src.core.celery_app worker -l info
    environment:
      <<: *shared-env
      DATABASE_URL: postgresql://divap:${POSTGRES_PASSWORD:-divap}@postgres:5432/divap
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  beat:
    build: .
    restart: unless-stopped
    command: celery -A src.core.celery_app beat -l info
    environment:
      <<: *shared-env
      DATABASE_URL: postgresql://divap:${POSTGRES_PASSWORD:-divap}@postgres:5432/divap
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  otc-telegram:
    build: .
    restart: unless-stopped
    command: python -m src.otc.telegram_listener
    environment:
      <<: *shared-env
      DATABASE_URL: postgresql://divap:${POSTGRES_PASSWORD:-divap}@postgres:5432/divap
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - redis
      - worker

  postgres:
    image: timescale/timescaledb:latest-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: divap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-divap}
      POSTGRES_DB: divap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divap -d divap"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
