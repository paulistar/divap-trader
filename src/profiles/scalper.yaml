id: scalper
name: Scalper — O Relâmpago
tagline: Giro rápido
description: >
  Operações curtas em 15m/1h (M5/M1 em fase futura). BTC e ETH USDT.
  RR 1:1 a 1:1,5 — muitos trades, alvos curtos, exige volatilidade e momentum.
execution:
  min_confidence: high
  block_on_reject: true
  min_risk_reward: "1.2"
  max_open_trades: 4
  allowed_timeframes: ["15m", "1h"]
  allocation_multiplier: "0.75"
advisor:
  ideal_fear_greed_min: 40
  ideal_fear_greed_max: 85
  preferred_verdicts: ["confirm", "caution"]
  min_avg_score: 40
  volatility: high
  needs_momentum: true
scan:
  interval_seconds: 300
  timeframes: ["15m", "1h"]
  symbols: ["BTCUSDT", "ETHUSDT"]
  monitor_interval_seconds: 120
exit:
  take_profit_fibo: "1.0"
  time_stop_candles: 8
  time_stop_min_move_pct: "0.003"
  time_stop_timeframes: ["15m"]
