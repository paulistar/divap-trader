id: divap
name: DIVAP
tagline: Swing técnico com confluência
description: Padrão do sistema — setups 1h/4h/1d com contexto de mercado e confiança alta.
execution:
  min_confidence: high
  block_on_reject: true
  min_risk_reward: "2.0"
  max_open_trades: 5
  allowed_timeframes: ["1h", "4h", "1d"]
  allocation_multiplier: "1.0"
advisor:
  ideal_fear_greed_min: 20
  ideal_fear_greed_max: 80
  preferred_verdicts: ["confirm", "caution"]
  min_avg_score: 35
  volatility: medium
  needs_momentum: false
