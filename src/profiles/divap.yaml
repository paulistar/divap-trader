id: divap
name: DIVAP — Rei da Validação
tagline: Sniper de confluência
description: >
  Setup DIVAP completo (Divergência, Invalidação, Volume, Ação de Preço, Padrão).
  Swing em 1h/4h/1d no top 20 crypto. RR mínimo 1:1,5 — só entradas com confluência alta.
execution:
  min_confidence: high
  block_on_reject: true
  min_risk_reward: "1.5"
  max_open_trades: 50
  allowed_timeframes: ["1h", "4h", "1d"]
  allocation_multiplier: "1.0"
advisor:
  ideal_fear_greed_min: 20
  ideal_fear_greed_max: 80
  preferred_verdicts: ["confirm", "caution"]
  min_avg_score: 35
  volatility: medium
  needs_momentum: false
scan:
  interval_seconds: 900
  timeframes: ["1h", "4h", "1d"]
  symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - XRPUSDT
    - ADAUSDT
    - DOGEUSDT
    - TRXUSDT
    - AVAXUSDT
    - LINKUSDT
    - DOTUSDT
    - POLUSDT
    - SHIBUSDT
    - LTCUSDT
    - BCHUSDT
    - UNIUSDT
    - ATOMUSDT
    - XLMUSDT
    - NEARUSDT
    - ICPUSDT
  monitor_interval_seconds: 300
