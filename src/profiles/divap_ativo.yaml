id: divap_ativo
name: DIVAP Ativo
tagline: Execução na testnet
description: >
  Mesmo universo DIVAP (top 20, 1h/4h/1d), porém aceita confiança média e RR por timeframe.
  Bloqueia só contexto reject. Indicado para validar entradas na testnet.
execution:
  min_confidence: medium
  block_on_reject: true
  min_risk_reward: "1.2"
  min_risk_reward_by_timeframe:
    "1h": "1.2"
    "4h": "1.5"
    "1d": "1.5"
  max_open_trades: 50
  allowed_timeframes: ["1h", "4h", "1d"]
  allocation_multiplier: "0.85"
advisor:
  ideal_fear_greed_min: 20
  ideal_fear_greed_max: 80
  preferred_verdicts: ["confirm", "caution"]
  min_avg_score: 35
  volatility: medium
  needs_momentum: false
scan:
  interval_seconds: 900
  timeframes: ["1h", "4h", "1d"]
  symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - XRPUSDT
    - ADAUSDT
    - DOGEUSDT
    - TRXUSDT
    - AVAXUSDT
    - LINKUSDT
    - DOTUSDT
    - POLUSDT
    - SHIBUSDT
    - LTCUSDT
    - BCHUSDT
    - UNIUSDT
    - ATOMUSDT
    - XLMUSDT
    - NEARUSDT
    - ICPUSDT
  monitor_interval_seconds: 300
exit:
  partial_take_profits:
    - { distance_pct: 25 }
    - { distance_pct: 50 }
    - { distance_pct: 100 }
  move_stop_to_breakeven_after: 1
